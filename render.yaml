services:
  # Backend API Service (FastAPI)
  - type: web
    name: ascentx-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true

  # Frontend Web Service (Static Site)
  - type: web
    name: ascentx-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ascentx-backend
          property: url
