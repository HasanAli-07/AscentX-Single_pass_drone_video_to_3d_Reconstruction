services:
  # Backend API Service (FastAPI)
  - type: web
    name: ascentx-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true

  # Frontend Web Service (Static Site)
  - type: web
    name: ascentx-frontend
    env: static
    buildCommand: NODE_OPTIONS="--max-old-space-size=4096" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ascentx-backend
          property: url

